<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    ร้านข้าวแกง - หน้าร้าน
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

      background: #f4f5f7;

      color: #222;

    }


    .header {

      position: sticky;

      top: 0;

      z-index: 10;

      background: #06c755;

      color: white;

      padding: 16px;

      box-shadow:
        0 2px 8px
        rgba(0,0,0,.12);

    }


    .header-row {

      max-width: 1000px;

      margin: auto;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

    }


    .title {

      font-size: 21px;

      font-weight: bold;

    }


    .date {

      font-size: 13px;

      margin-top: 4px;

      opacity: .9;

    }


    .refresh {

      border: none;

      background: white;

      color: #06a84f;

      padding: 9px 13px;

      border-radius: 9px;

      font-weight: bold;

      cursor: pointer;

    }


    .container {

      max-width: 1000px;

      margin: auto;

      padding: 15px;

    }


    .summary {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 10px;

      margin-bottom: 15px;

    }


    .summary-card {

      background: white;

      border-radius: 12px;

      padding: 13px;

      box-shadow:
        0 1px 5px
        rgba(0,0,0,.07);

      text-align: center;

    }


    .summary-number {

      font-size: 27px;

      font-weight: bold;

    }


    .summary-label {

      font-size: 13px;

      color: #666;

      margin-top: 4px;

    }


    .section {

      margin-top: 20px;

    }


    .section-title {

      font-size: 18px;

      font-weight: bold;

      margin-bottom: 10px;

    }


    .order-card {

      background: white;

      border-radius: 14px;

      margin-bottom: 12px;

      padding: 15px;

      box-shadow:
        0 2px 7px
        rgba(0,0,0,.08);

    }


    .order-top {

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      gap: 10px;

    }


    .order-id {

      font-size: 27px;

      font-weight: bold;

    }


    .order-time {

      color: #666;

      font-size: 13px;

      margin-top: 3px;

    }


    .status {

      padding: 6px 9px;

      border-radius: 8px;

      font-size: 12px;

      font-weight: bold;

      white-space: nowrap;

    }


    .status-new {

      background: #fff0d6;

      color: #a15b00;

    }


    .status-preparing {

      background: #e7f0ff;

      color: #1757a6;

    }


    .status-ready {

      background: #e5f8ec;

      color: #087a37;

    }


    .status-completed {

      background: #eeeeee;

      color: #666;

    }


    .customer {

      margin-top: 12px;

      font-weight: bold;

    }


    .pickup {

      margin-top: 6px;

      padding: 9px;

      background: #f5f5f5;

      border-radius: 9px;

      font-size: 14px;

    }


    .items {

      margin-top: 12px;

      border-top:
        1px solid #eee;

      padding-top: 10px;

    }


    .item {

      padding: 8px 0;

      border-bottom:
        1px dashed #ddd;

    }


    .item:last-child {

      border-bottom: none;

    }


    .item-name {

      font-weight: bold;

    }


    .item-detail {

      color: #666;

      font-size: 13px;

      margin-top: 3px;

    }


    .remark {

      margin-top: 10px;

      padding: 9px;

      background: #fff8df;

      border-radius: 8px;

      font-size: 13px;

    }


    .order-bottom {

      margin-top: 13px;

      padding-top: 12px;

      border-top:
        1px solid #eee;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

    }


    .total {

      font-size: 20px;

      font-weight: bold;

    }


    .payment {

      font-size: 13px;

      color: #666;

    }


    .actions {

      display: flex;

      gap: 8px;

      margin-top: 12px;

    }


    .btn {

      flex: 1;

      border: none;

      padding: 12px;

      border-radius: 9px;

      font-size: 14px;

      font-weight: bold;

      cursor: pointer;

    }


    .btn-primary {

      background: #06c755;

      color: white;

    }


    .btn-blue {

      background: #2878d8;

      color: white;

    }


    .btn-gray {

      background: #e9e9e9;

      color: #333;

    }


    .btn-red {

      background: #ffe4e4;

      color: #b00020;

    }


    .empty {

      background: white;

      border-radius: 12px;

      padding: 30px 15px;

      text-align: center;

      color: #777;

    }


    .loading {

      text-align: center;

      padding: 40px 15px;

      color: #666;

    }


    .error {

      background: #ffe7e7;

      color: #a00000;

      padding: 13px;

      border-radius: 10px;

      margin-bottom: 15px;

    }


    @media (
      max-width: 650px
    ) {

      .summary {

        grid-template-columns:
          repeat(2, 1fr);

      }


      .order-top {

        align-items: center;

      }


      .order-bottom {

        flex-direction: column;

        align-items: stretch;

      }

    }

    .filter-bar {

  display: flex;

  gap: 8px;

  flex-wrap: wrap;

  margin-bottom: 15px;

}


.filter-btn {

  border: none;

  background: white;

  color: #555;

  padding: 10px 13px;

  border-radius: 10px;

  font-size: 13px;

  font-weight: bold;

  cursor: pointer;

  box-shadow:
    0 1px 5px
    rgba(0,0,0,.08);

}


.filter-btn.active {

  background: #06c755;

  color: white;

}


.filter-btn:active {

  transform: scale(.97);

}
    
  </style>

</head>


<body>


  <div class="header">

    <div class="header-row">

      <div>

        <div class="title">
          🍱 ร้านข้าวแกง ตามสั่ง
        </div>

        <div
          class="date"
          id="today">
        </div>

        <div
          class="date"
          id="lastUpdated">
        </div>

      </div>


      <button
        class="refresh"
        onclick="loadOrders()">

        🔄 รีเฟรช

      </button>

    </div>

  </div>


  <div class="container">

    <div
      id="summary"
      class="summary">
    </div>

    <div class="filter-bar">

    <button
      class="filter-btn active"
      data-filter="ALL"
      onclick="setOrderFilter('ALL')">
      📋 ทั้งหมด
    </button>
  
    <button
      class="filter-btn"
      data-filter="NEW"
      onclick="setOrderFilter('NEW')">
      🆕 ใหม่
    </button>
  
    <button
      class="filter-btn"
      data-filter="PREPARING"
      onclick="setOrderFilter('PREPARING')">
      👨‍🍳 กำลังทำ
    </button>
  
    <button
      class="filter-btn"
      data-filter="READY"
      onclick="setOrderFilter('READY')">
      ✅ พร้อมรับ
    </button>
  
    <button
      class="filter-btn"
      data-filter="COMPLETED"
      onclick="setOrderFilter('COMPLETED')">
      ✔️ เสร็จแล้ว
    </button>
  
    <button
      class="filter-btn"
      data-filter="CANCELLED"
      onclick="setOrderFilter('CANCELLED')">
      ❌ ยกเลิก
    </button>
  
  </div>

    <div
      id="app">

      <div class="loading">

        กำลังโหลดออเดอร์...

      </div>

    </div>

  </div>


  <script>

    /*
     * =====================================
     * API URL
     * =====================================
     *
     * ใช้ URL /exec ตัวเดียวกับระบบ LIFF
     */

    const API_URL =
      'https://script.google.com/macros/s/AKfycbxawZU8dYjnixWed3eVoUPqA88PAtZmCwTgyJghOtcP9e4iqJQDghzrrQslK2X2CO3S/exec';


    let orders = [];
    
    let currentFilter = 'ALL';

    /*
     * =====================================
     * สรุปจำนวน
     * =====================================
     */

    function renderSummary() {

      const countNew =
        orders.filter(
          o => o.status === 'NEW'
        ).length;


      const countPreparing =
        orders.filter(
          o =>
            o.status ===
            'PREPARING'
        ).length;


      const countReady =
        orders.filter(
          o =>
            o.status ===
            'READY'
        ).length;


      const countCompleted =
        orders.filter(
          o =>
            o.status ===
            'COMPLETED'
        ).length;


      document
        .getElementById(
          'summary'
        )
        .innerHTML = `

          <div class="summary-card">

            <div class="summary-number">
              ${countNew}
            </div>

            <div class="summary-label">
              🆕 ออเดอร์ใหม่
            </div>

          </div>


          <div class="summary-card">

            <div class="summary-number">
              ${countPreparing}
            </div>

            <div class="summary-label">
              👨‍🍳 กำลังทำ
            </div>

          </div>


          <div class="summary-card">

            <div class="summary-number">
              ${countReady}
            </div>

            <div class="summary-label">
              ✅ พร้อมรับ
            </div>

          </div>


          <div class="summary-card">

            <div class="summary-number">
              ${countCompleted}
            </div>

            <div class="summary-label">
              ✔️ เสร็จแล้ว
            </div>

          </div>

        `;

    }


    /*
     * =====================================
     * แสดงออเดอร์
     * =====================================
     */

    function renderOrders() {

      const app =
        document.getElementById(
          'app'
        );


      if (
        orders.length === 0
      ) {

        app.innerHTML = `

          <div class="empty">

            📭 วันนี้ยังไม่มีออเดอร์

          </div>

        `;

        return;

      }


      const groups = [

        {
          status: 'NEW',
          title: '🆕 ออเดอร์ใหม่'
        },
      
        {
          status: 'PREPARING',
          title: '👨‍🍳 กำลังทำ'
        },
      
        {
          status: 'READY',
          title: '✅ พร้อมรับ'
        },
      
        {
          status: 'COMPLETED',
          title: '✔️ เสร็จแล้ว'
        },
      
        {
          status: 'CANCELLED',
          title: '❌ ยกเลิก'
        }
      
      ];


      let html = '';


      groups.forEach(
        function(group) {

          const groupOrders =
            orders.filter(
              function(order) {
          
                if (
                  currentFilter === 'ALL'
                ) {
          
                  return (
                    order.status ===
                    group.status
                  );
          
                }
          
          
                return (
                  order.status ===
                  currentFilter
                );
          
              }
            );


          if (
            groupOrders.length === 0
          ) {

            return;

          }


          html += `

            <div class="section">

              <div
                class="section-title">

                ${group.title}

              </div>

          `;


          groupOrders.forEach(
            function(order) {

              html +=
                renderOrderCard(
                  order
                );

            }
          );


          html += `

            </div>

          `;

        }
      );


      app.innerHTML =
        html ||
        `

          <div class="empty">

            ไม่มีออเดอร์ที่ต้องดำเนินการ

          </div>

        `;

    }

    function setOrderFilter(
  filter
) {

  currentFilter =
    filter;


  document
    .querySelectorAll(
      '.filter-btn'
    )
    .forEach(
      function(button) {

        button.classList.toggle(
          'active',
          button.dataset.filter ===
          filter
        );

      }
    );


  renderOrders();

}


function updateFilterCounts() {

  const counts = {

    ALL:
      orders.length,

    NEW:
      orders.filter(
        function(order) {
          return order.status === 'NEW';
        }
      ).length,

    PREPARING:
      orders.filter(
        function(order) {
          return order.status === 'PREPARING';
        }
      ).length,

    READY:
      orders.filter(
        function(order) {
          return order.status === 'READY';
        }
      ).length,

    COMPLETED:
      orders.filter(
        function(order) {
          return order.status === 'COMPLETED';
        }
      ).length,

    CANCELLED:
      orders.filter(
        function(order) {
          return order.status === 'CANCELLED';
        }
      ).length

  };


  const labels = {

    ALL:
      '📋 ทั้งหมด',

    NEW:
      '🆕 ใหม่',

    PREPARING:
      '👨‍🍳 กำลังทำ',

    READY:
      '✅ พร้อมรับ',

    COMPLETED:
      '✔️ เสร็จแล้ว',

    CANCELLED:
      '❌ ยกเลิก'

  };


  document
    .querySelectorAll(
      '.filter-btn'
    )
    .forEach(
      function(button) {

        const filter =
          button.dataset.filter;

        const count =
          counts[filter] ?? 0;


        button.textContent =
          labels[filter] +
          ' ' +
          count;

      }
    );

}

    /*
     * =====================================
     * การ์ดออเดอร์
     * =====================================
     */

    function renderOrderCard(
      order
    ) {

      const statusClass =
        getStatusClass(
          order.status
        );


      const statusText =
        getStatusText(
          order.status
        );


      let pickupText =
        'รับตอนนี้';
      
      
      if (
        order.pickupType ===
        'SCHEDULED'
      ) {
      
        pickupText =
          '🕐 รับเวลา ' +
          (
            order.pickupTime ||
            order.pickupSlot ||
            '-'
          );
      
      }


      let itemsHtml = '';


      (
        order.items || []
      ).forEach(
        function(item) {

          let optionText =
            item.options || '';


          let remarkText =
            item.remark || '';


          itemsHtml += `

            <div class="item">

              <div class="item-name">

                ${escapeHtml(
                  item.menuName
                )}

                ×
                ${Number(
                  item.qty
                )}

              </div>


              ${
                optionText
                  ? `
                    <div class="item-detail">

                      ตัวเลือก:
                      ${escapeHtml(
                        optionText
                      )}

                    </div>
                  `
                  : ''
              }


              ${
                remarkText
                  ? `
                    <div class="item-detail">

                      📝
                      ${escapeHtml(
                        remarkText
                      )}

                    </div>
                  `
                  : ''
              }

            </div>

          `;

        }
      );


      return `

        <div class="order-card">

          <div class="order-top">

            <div>

              <div class="order-id">

                ${escapeHtml(
                  order.orderId
                )}

              </div>


              <div class="order-time">

                สั่งเวลา
                ${escapeHtml(
                  order.time
                )}

              </div>

            </div>


            <div
              class="status ${statusClass}">

              ${statusText}

            </div>

          </div>


          <div class="customer">

            👤
            ${escapeHtml(
              order.customerName ||
              '-'
            )}

          </div>


          <div class="pickup">

            ${escapeHtml(
              pickupText
            )}

          </div>


          <div class="items">

            ${itemsHtml}

          </div>


          ${
            order.remark
              ? `
                <div class="remark">

                  📝 หมายเหตุ:
                  ${escapeHtml(
                    order.remark
                  )}

                </div>
              `
              : ''
          }


          <div class="order-bottom">

            <div>

              <div class="total">

                ${Number(
                  order.total
                ).toLocaleString()}

                บาท

              </div>


              <div class="payment">

                ${
                  order.payment ===
                  'CASH'
                    ? '💵 เงินสด'
                    : '📱 QR Payment'
                }

                ${
                  order.paymentStatus ===
                  'PAID'
                    ? ' • ชำระแล้ว'
                    : ' • ยังไม่ชำระ'
                }

              </div>

            </div>

          </div>


          ${renderActions(order)}

        </div>

      `;

    }


    /*
     * =====================================
     * ปุ่มเปลี่ยนสถานะ
     * =====================================
     */

    function renderActions(order) {

  if (order.status === 'NEW') {

    return `
      <div class="actions">

        <button
          class="btn btn-primary"
          onclick="
            updateStatus(
              '${escapeJs(order.orderId)}',
              '${escapeJs(order.date)}',
              'PREPARING'
            )
          ">

          👨‍🍳 รับออเดอร์

        </button>

        <button
          class="btn btn-red"
          onclick="
            updateStatus(
              '${escapeJs(order.orderId)}',
              '${escapeJs(order.date)}',
              'CANCELLED'
            )
          ">

          ❌ ยกเลิก

        </button>

      </div>
    `;

  }


  if (order.status === 'PREPARING') {

    return `
      <div class="actions">

        <button
          class="btn btn-blue"
          onclick="
            updateStatus(
              '${escapeJs(order.orderId)}',
              '${escapeJs(order.date)}',
              'READY'
            )
          ">

          ✅ พร้อมรับ

        </button>

      </div>
    `;

  }


  if (order.status === 'READY') {

    return `
      <div class="actions">

        <button
          class="btn btn-primary"
          onclick="
            updateStatus(
              '${escapeJs(order.orderId)}',
              '${escapeJs(order.date)}',
              'COMPLETED'
            )
          ">

          ✔️ ลูกค้ารับแล้ว

        </button>

      </div>
    `;

  }


  if (order.status === 'COMPLETED') {

    return `
      <div class="actions">

        <div
          style="
            width:100%;
            text-align:center;
            padding:10px;
            color:#666;
            background:#f3f3f3;
            border-radius:9px;
          ">

          ✔️ ออเดอร์เสร็จสิ้น

        </div>

      </div>
    `;

  }


  if (order.status === 'CANCELLED') {

    return `
      <div class="actions">

        <div
          style="
            width:100%;
            text-align:center;
            padding:10px;
            color:#b00020;
            background:#ffe8e8;
            border-radius:9px;
          ">

          ❌ ออเดอร์ถูกยกเลิก

        </div>

      </div>
    `;

  }


  return '';

}


    /*
     * =====================================
     * ส่งเปลี่ยนสถานะ
     * =====================================
     */

    async function updateStatus(
      orderId,
      orderDate,
      status
    ) {

      const statusNames = {

        PREPARING:
          'กำลังทำ',

        READY:
          'พร้อมรับ',

        COMPLETED:
          'เสร็จแล้ว',

        CANCELLED:
          'ยกเลิก'

      };


      const text =
        statusNames[status] ||
        status;


      if (
        !confirm(
          'เปลี่ยน ' +
          orderId +
          ' เป็น "' +
          text +
          '" ?'
        )
      ) {

        return;

      }


      try {

        const response =
          await fetch(
            API_URL,
            {

              method: 'POST',

              headers: {

                'Content-Type':
                  'text/plain;charset=utf-8'

              },

              body:
                JSON.stringify({

                  action:
                    'updateOrderStatus',

                  orderId:
                    orderId,

                  orderDate:
                    orderDate,

                  status:
                    status

                })

            }
          );


        const result =
          await response.json();


        if (
          !result.success
        ) {

          throw new Error(
            result.error ||
            'เปลี่ยนสถานะไม่สำเร็จ'
          );

        }


        await loadOrders();


      } catch (error) {

        alert(
          error.message ||
          String(error)
        );

      }

    }


    /*
     * =====================================
     * Helpers
     * =====================================
     */

    function getStatusClass(
      status
    ) {

      if (
        status === 'NEW'
      ) {

        return 'status-new';

      }


      if (
        status ===
        'PREPARING'
      ) {

        return 'status-preparing';

      }


      if (
        status === 'READY'
      ) {

        return 'status-ready';

      }


      return 'status-completed';

    }


    function getStatusText(
      status
    ) {

      const map = {

        NEW:
          '🆕 ใหม่',

        PREPARING:
          '👨‍🍳 กำลังทำ',

        READY:
          '✅ พร้อมรับ',

        COMPLETED:
          '✔️ เสร็จแล้ว',

        CANCELLED:
          '❌ ยกเลิก'

      };


      return (
        map[status] ||
        status
      );

    }


    function escapeHtml(
      value
    ) {

      return String(
        value ?? ''
      )
      .replace(
        /&/g,
        '&amp;'
      )
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      )
      .replace(
        /"/g,
        '&quot;'
      )
      .replace(
        /'/g,
        '&#039;'
      );

    }


    function escapeJs(
      value
    ) {

      return String(
        value ?? ''
      )
      .replace(
        /\\/g,
        '\\\\'
      )
      .replace(
        /'/g,
        "\\'"
      );

    }


    /*
     * =====================================
     * เริ่มต้น
     * =====================================
     */
    let isLoadingOrders = false;


async function loadOrders() {

  if (isLoadingOrders) {
    return;
  }

  isLoadingOrders = true;

  try {

    const controller =
      new AbortController();

    const timeout =
      setTimeout(
        function() {
          controller.abort();
        },
        10000
      );


    let response;

    try {

      response =
        await fetch(
          API_URL +
          '?action=getOrders',
          {
            method: 'GET',
            cache: 'no-store',
            signal: controller.signal
          }
        );

    } finally {

      clearTimeout(timeout);

    }


    if (!response.ok) {

      throw new Error(
        'Backend HTTP Error: ' +
        response.status
      );

    }


    const data =
      await response.json();


    console.log(
      'ORDERS:',
      data
    );


    if (!data.success) {

      throw new Error(
        data.error ||
        'ไม่สามารถโหลดออเดอร์ได้'
      );

    }


    orders =
      data.orders || [];


    document
      .getElementById('today')
      .textContent =
        'วันที่ ' +
        data.date;


    renderSummary();

    updateFilterCounts();

    renderOrders();


    document
      .getElementById('lastUpdated')
      .textContent =
        'อัปเดตล่าสุด ' +
        new Date()
          .toLocaleTimeString(
            'th-TH',
            {
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit'
            }
          );


  } catch (error) {

    console.error(
      'LOAD ORDERS ERROR:',
      error
    );


    document
      .getElementById('app')
      .innerHTML = `

        <div class="error">

          ❌ โหลดออเดอร์ไม่สำเร็จ

          <br><br>

          ${escapeHtml(
            error.message ||
            String(error)
          )}

        </div>

      `;


  } finally {

    isLoadingOrders = false;

  }

}


// โหลดครั้งแรก
loadOrders();


// Auto refresh ทุก 60 วินาที
setInterval(
  loadOrders,
  60000
);

  </script>

</body>

</html>
